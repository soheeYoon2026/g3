[pytest]
# tests/ 만 수집한다. scripts/ 에 test_ 로 시작하는 **실험 스크립트** 셋이 있는데
# (test_delta_calibration, test_mesh_hypothesis, test_ood_hypothesis) 모듈 수준에서
# argparse 를 부르므로, 저장소 루트에서 pytest 를 돌리면 수집 단계가 SystemExit 로 죽고
# "no tests collected" 로 끝났다. 2026-09-17 까지 그 상태였다.
testpaths = tests
norecursedirs = recovered .venv data var predictions models benchmarks scripts integration domino
